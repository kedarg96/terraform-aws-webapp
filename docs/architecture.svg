<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">Web App on AWS with Terraform: VPC, Load Balancer and Auto Scaling</text>

  <!-- VPC -->
  <rect x="215" y="45" width="680" height="480" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="235" y="68" font-size="13" font-weight="bold" fill="#c2410c">VPC 10.0.0.0/16 (us-east-1)</text>

  <!-- Internet users -->
  <rect x="30" y="230" width="150" height="80" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="105" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Internet users</text>
  <text x="105" y="282" text-anchor="middle" font-size="12" fill="#374151">browser, HTTP :80</text>

  <!-- IGW -->
  <rect x="235" y="235" width="110" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Internet</text>
  <text x="290" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Gateway</text>

  <!-- ALB -->
  <rect x="385" y="205" width="185" height="130" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="477" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">Application Load</text>
  <text x="477" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">Balancer</text>
  <text x="477" y="272" text-anchor="middle" font-size="12" fill="#5b21b6">listener :80, target group</text>
  <text x="477" y="290" text-anchor="middle" font-size="12" fill="#5b21b6">health check: GET / every 15 s</text>
  <text x="477" y="316" text-anchor="middle" font-size="11" fill="#5b21b6">ALB security group: HTTP from anywhere</text>

  <!-- ASG boundary -->
  <rect x="598" y="80" width="285" height="430" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="740" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">Auto Scaling group (min 2, max 3)</text>
  <text x="740" y="118" text-anchor="middle" font-size="11" fill="#5b21b6">replaces any server that fails its health check</text>

  <!-- Subnet 1 -->
  <rect x="618" y="132" width="245" height="170" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Public subnet 1 (us-east-1a)</text>
  <rect x="648" y="170" width="185" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">EC2 t3.micro</text>
  <text x="740" y="214" text-anchor="middle" font-size="12" fill="#166534">Amazon Linux, Nginx</text>
  <text x="740" y="232" text-anchor="middle" font-size="11" fill="#166534">web SG: HTTP only</text>
  <text x="740" y="248" text-anchor="middle" font-size="11" fill="#166534">from the load balancer</text>

  <!-- Subnet 2 -->
  <rect x="618" y="320" width="245" height="170" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">Public subnet 2 (us-east-1b)</text>
  <rect x="648" y="358" width="185" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="740" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">EC2 t3.micro</text>
  <text x="740" y="402" text-anchor="middle" font-size="12" fill="#166534">Amazon Linux, Nginx</text>
  <text x="740" y="420" text-anchor="middle" font-size="11" fill="#166534">web SG: HTTP only</text>
  <text x="740" y="436" text-anchor="middle" font-size="11" fill="#166534">from the load balancer</text>

  <!-- Terraform -->
  <rect x="30" y="400" width="150" height="110" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="105" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">Terraform</text>
  <text x="105" y="448" text-anchor="middle" font-size="11" fill="#5b21b6">providers.tf  variables.tf</text>
  <text x="105" y="464" text-anchor="middle" font-size="11" fill="#5b21b6">main.tf  compute.tf</text>
  <text x="105" y="480" text-anchor="middle" font-size="11" fill="#5b21b6">outputs.tf</text>

  <!-- Arrows -->
  <line x1="180" y1="270" x2="233" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="345" y1="270" x2="383" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="572" y1="245" x2="646" y2="215" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="572" y1="295" x2="646" y2="395" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <text x="560" y="372" text-anchor="middle" font-size="11" fill="#374151">forward to healthy</text>
  <text x="560" y="386" text-anchor="middle" font-size="11" fill="#374151">servers</text>
  <path d="M 180 455 L 205 455 L 205 520 L 215 520" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M 180 455 L 215 455" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrp)"/>
  <text x="225" y="448" font-size="11" fill="#6d28d9">terraform apply</text>
</svg>
